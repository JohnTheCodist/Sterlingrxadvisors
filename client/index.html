<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SterlingRx Advisors — Pharmacy Business Intelligence</title>
    <!-- SVG first so the tab mark stays sharp at any density; the PNG is the
         fallback for browsers that don't take SVG favicons, and is the very
         same file the desktop app ships as its icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta
      name="description"
      content="See what's selling, what's profiting, and what's quietly costing you. Business intelligence built for the Nigerian pharmacy counter."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist carries display only; Inter stays as the body face and IBM Plex
         Mono as the numeral outlier. Three families is the ceiling — before
         this, --font-display aliased to Inter, so one face did every job. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
