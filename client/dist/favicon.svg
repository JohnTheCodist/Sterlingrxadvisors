<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SterlingRx Advisors">
  <!-- Same geometry and the same two colours as the desktop icon
       (desktop/build/icon.png, generated by desktop/scripts/make-icon.js):
       a 22%-radius tile in the brand teal with the monospace S centred at 56%
       of the tile. Sampled from the rendered icon rather than re-derived, so
       the tab and the taskbar cannot drift apart. -->
  <rect width="256" height="256" rx="56" fill="#047878"/>
  <text x="128" y="130" fill="#f8fdfc"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="143" font-weight="700"
        text-anchor="middle" dominant-baseline="central">S</text>
</svg>
